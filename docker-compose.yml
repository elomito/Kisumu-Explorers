services:
  postgres:
    image: postgres:16-alpine
    container_name: kisumu-explorers-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kisumu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kisumu_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-kisumu_explorers}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-kisumu} -d $${POSTGRES_DB:-kisumu_explorers}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: kisumu-explorers-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

volumes:
  postgres_data:
